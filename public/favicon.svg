<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="{SS} favicon">
  <!-- background -->
  <rect width="100%" height="100%" fill="#000000"/>
  <!-- centered text with curly braces -->
  <text x="50%" y="50%"
        fill="#FFFFFF"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="240"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-6">
    {SS}
  </text>
</svg>
